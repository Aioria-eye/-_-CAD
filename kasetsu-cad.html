<!DOCTYPE html>
<html lang="ja" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>かんたん仮設CAD｜総合仮設計画図</title>
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --line:#d5dbe3; --text:#1f2933; --muted:#6b7785;
  --accent:#1565c0; --accent-soft:#e3eefc; --danger:#c62828; --ok:#2e7d32;
  --font:"Yu Gothic UI","Meiryo","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root{ --bg:#eef1f5; --panel:#ffffff; --text:#1f2933; } }
*{box-sizing:border-box}
html,body{margin:0;block-size:100%;overflow:hidden;font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg)}
button,select,input,textarea{font-family:inherit;font-size:13px;color:var(--text)}
#app{display:grid;grid-template-rows:auto 1fr;block-size:100vh}
/* top bar */
#top{display:flex;align-items:center;gap:6px;padding-block:6px;padding-inline:10px;background:var(--panel);border-block-end:1px solid var(--line);flex-wrap:wrap}
#top .brand{font-weight:700;color:var(--accent);margin-inline-end:8px;white-space:nowrap}
#top .grp{display:flex;align-items:center;gap:4px;padding-inline:6px;border-inline-start:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding-block:5px;padding-inline:9px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accent-soft);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
select,input[type=number],input[type=text],input[type=date],textarea{border:1px solid var(--line);border-radius:5px;padding-block:4px;padding-inline:6px;background:#fff}
input[type=number]{inline-size:90px}
label.lbl{color:var(--muted);font-size:12px}
/* main */
#main{display:grid;grid-template-columns:212px 1fr 280px;min-block-size:0}
#left,#right{background:var(--panel);overflow-y:auto;min-block-size:0}
#left{border-inline-end:1px solid var(--line);padding:8px}
#right{border-inline-start:1px solid var(--line)}
.sec{margin-block-end:10px}
.sec h3{font-size:12px;color:var(--muted);margin-block:6px 4px;margin-inline:2px;font-weight:600;letter-spacing:.05em}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tool{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:6px;padding-block:5px;padding-inline:6px;cursor:pointer;text-align:start;font-size:12px}
.tool .ic{inline-size:18px;text-align:center;font-weight:700;color:var(--accent)}
.tool:hover{border-color:var(--accent)}
.tool.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tool.active .ic{color:#fff}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.part{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px;cursor:pointer;font-size:10.5px;line-height:1.15;text-align:center}
.part canvas{inline-size:44px;block-size:30px}
.part:hover{border-color:var(--accent)}
.part.active{outline:2px solid var(--accent);background:var(--accent-soft)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-block-end:4px}
.seg button{flex:1;border:0;background:#fff;padding:4px;cursor:pointer;font-size:12px}
.seg button.on{background:var(--accent);color:#fff}
/* canvas */
#center{position:relative;min-block-size:0;min-inline-size:0;display:grid;grid-template-rows:auto 1fr auto}
#hint{background:#fffbe6;border-block-end:1px solid #f0e2a8;padding-block:5px;padding-inline:10px;font-size:12.5px;min-block-size:28px}
#wrap{position:relative;overflow:hidden;background:#fff}
#cv{position:absolute;inset:0;inline-size:100%;block-size:100%;display:block;touch-action:none}
#status{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--panel);border-block-start:1px solid var(--line);padding-block:4px;padding-inline:8px;font-size:12px}
.tog{border:1px solid var(--line);border-radius:12px;padding-block:2px;padding-inline:9px;background:#fff;cursor:pointer;font-size:12px;color:var(--muted)}
.tog.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
#coord{margin-inline-start:auto;color:var(--muted);font-variant-numeric:tabular-nums}
#readout{position:absolute;pointer-events:none;background:rgba(21,101,192,.92);color:#fff;border-radius:4px;padding-block:2px;padding-inline:6px;font-size:12px;white-space:nowrap;display:none;z-index:5}
#dyn{position:absolute;display:none;z-index:6;background:#fff;border:2px solid var(--accent);border-radius:6px;padding:6px;box-shadow:0 4px 14px rgba(0,0,0,.18);font-size:12px}
#dyn .r{display:flex;align-items:center;gap:4px;margin-block:2px}
#dyn .r span{inline-size:44px;color:var(--muted)}
#dyn input{inline-size:96px}
#dyn .t{color:var(--muted);font-size:11px;margin-block-start:3px}
/* right */
.tabs{display:flex;border-block-end:1px solid var(--line);position:sticky;inset-block-start:0;background:var(--panel);z-index:2}
.tabs button{flex:1;border:0;background:none;padding-block:8px;cursor:pointer;font-size:12px;color:var(--muted);border-block-end:2px solid transparent}
.tabs button.on{color:var(--accent);border-block-end-color:var(--accent);font-weight:700}
.pane{padding:10px;display:none}
.pane.on{display:block}
.row{display:grid;grid-template-columns:86px 1fr;align-items:center;gap:6px;margin-block-end:6px}
.row>span{color:var(--muted);font-size:12px}
.row input[type=number],.row input[type=text],.row select,.row textarea,.row input[type=date]{inline-size:100%}
.row .pair{display:flex;gap:4px;align-items:center}
.row .pair input{inline-size:50%}
.unit{color:var(--muted);font-size:11px;white-space:nowrap}
.big{font-size:15px;font-weight:700;color:var(--accent)}
.btns{display:flex;gap:4px;flex-wrap:wrap;margin-block:8px}
.empty{color:var(--muted);line-height:1.7}
.note{color:var(--muted);font-size:11.5px;line-height:1.6;margin-block:6px}
.hr{border-block-start:1px solid var(--line);margin-block:10px}
.layer{display:grid;grid-template-columns:22px 1fr 30px 30px;align-items:center;gap:4px;padding-block:4px;padding-inline:4px;border-radius:5px;cursor:pointer}
.layer:hover{background:#f5f7fa}
.layer.cur{background:var(--accent-soft)}
.layer .ib{border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;font-size:11px;padding-block:2px}
.layer .ib.off{color:#bbb;background:#f3f3f3}
.layer .cnt{color:var(--muted);font-size:11px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:center;justify-content:center;z-index:50}
#modal.on{display:flex}
#modal .box{background:#fff;border-radius:10px;min-inline-size:340px;max-inline-size:520px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#modal h2{font-size:15px;margin-block:0 10px}
#modal .msg{color:var(--muted);line-height:1.6;margin-block-end:10px;white-space:pre-wrap}
#modal .row{grid-template-columns:120px 1fr}
#modal .acts{display:flex;justify-content:flex-end;gap:6px;margin-block-start:12px}
#toast{position:fixed;inset-block-end:46px;inset-inline-start:50%;transform:translateX(-50%);background:#263238;color:#fff;padding-block:8px;padding-inline:14px;border-radius:6px;font-size:13px;display:none;z-index:60;max-inline-size:70vw;text-align:center}
.hidden{display:none}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <span class="brand">かんたん仮設CAD</span>
    <div class="grp">
      <button class="btn" id="bNew" title="新規作成">新規</button>
      <button class="btn" id="bOpen" title="保存データ(.json)を開く">開く</button>
      <button class="btn" id="bSave" title="作業データを保存 (Ctrl+S)">保存</button>
    </div>
    <div class="grp">
      <button class="btn" id="bUndo" title="元に戻す (Ctrl+Z)">↶ 元に戻す</button>
      <button class="btn" id="bRedo" title="やり直し (Ctrl+Y)">↷ やり直し</button>
    </div>
    <div class="grp">
      <button class="btn" id="bBg" title="PDF・画像の平面図を背景として読み込む">背景図を読込</button>
    </div>
    <div class="grp">
      <label class="lbl" for="selScale">縮尺</label>
      <select id="selScale">
        <option value="50">1/50</option><option value="100">1/100</option><option value="200" selected>1/200</option>
        <option value="300">1/300</option><option value="500">1/500</option><option value="custom">任意…</option>
      </select>
      <label class="lbl" for="selPaper">用紙</label>
      <select id="selPaper">
        <option value="A3L" selected>A3 横</option><option value="A3P">A3 縦</option>
        <option value="A4L">A4 横</option><option value="A4P">A4 縦</option>
        <option value="A2L">A2 横</option><option value="A1L">A1 横</option>
      </select>
      <label class="lbl" for="selGrid">グリッド</label>
      <select id="selGrid">
        <option value="100">100</option><option value="250">250</option><option value="500">500</option>
        <option value="1000" selected>1000</option><option value="2000">2000</option><option value="5000">5000</option>
      </select><span class="unit">mm</span>
    </div>
    <div class="grp">
      <button class="btn" id="bFit" title="全体を表示">全体表示</button>
      <button class="btn" id="bFitPaper" title="用紙範囲を表示">用紙表示</button>
    </div>
    <div class="grp">
      <button class="btn" id="bImg" title="PNG/JPEG画像で出力">画像出力</button>
      <button class="btn primary" id="bPdf" title="指定縮尺でPDF出力">PDF出力</button>
    </div>
    <input type="file" id="fOpen" accept=".json,application/json" class="hidden">
    <input type="file" id="fBg" accept=".pdf,application/pdf,image/png,image/jpeg,image/gif,image/webp,image/bmp" class="hidden">
  </header>
  <div id="main">
    <aside id="left">
      <div class="sec"><h3>基本</h3><div class="tools" id="tBasic"></div></div>
      <div class="sec"><h3>作図</h3><div class="tools" id="tDraw"></div></div>
      <div class="sec"><h3>外部足場</h3><button class="btn" id="bScaffold" style="inline-size:100%">選択した外周から作成</button></div>
      <div class="sec"><h3>計測・背景・出力</h3><div class="tools" id="tMeasure"></div></div>
      <div class="sec"><h3>動線</h3><div class="tools" id="tRoute"></div></div>
      <div class="sec"><h3>エリア（半透明）</h3>
        <div class="seg" id="areaMode"><button data-m="rect" class="on">矩形で描く</button><button data-m="poly">多角形で描く</button></div>
        <div class="tools" id="tArea"></div></div>
      <div class="sec"><h3>仮設パーツ（クリックで配置）</h3><div class="parts" id="tParts"></div></div>
    </aside>
    <section id="center">
      <div id="hint">ツールを選んで作図してください。</div>
      <div id="wrap">
        <canvas id="cv"></canvas>
        <div id="readout"></div>
        <div id="dyn"></div>
      </div>
      <div id="status">
        <span class="lbl">スナップ:</span>
        <button class="tog" data-snap="grid">グリッド</button>
        <button class="tog on" data-snap="end">線端</button>
        <button class="tog on" data-snap="mid">中点</button>
        <button class="tog on" data-snap="inter">交点</button>
        <button class="tog on" data-snap="center">中心</button>
        <span class="lbl" style="margin-inline-start:8px">方向:</span>
        <button class="tog" data-snap="ortho" title="Shiftキーを押している間も水平・垂直に固定">水平・垂直固定</button>
        <button class="tog" data-snap="angle">15°刻み</button>
        <span id="coord">X 0 / Y 0 mm</span>
      </div>
    </section>
    <aside id="right">
      <div class="tabs" id="tabs">
        <button data-t="prop" class="on">プロパティ</button>
        <button data-t="layer">レイヤー</button>
        <button data-t="bg">背景図</button>
        <button data-t="sheet">図枠</button>
      </div>
      <div class="pane on" id="p-prop"></div>
      <div class="pane" id="p-layer"></div>
      <div class="pane" id="p-bg"></div>
      <div class="pane" id="p-sheet"></div>
    </aside>
  </div>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<script>
'use strict';
/* =========================================================================
   かんたん仮設CAD  — 総合仮設計画図用 簡易2D CAD
   構成:
     1. 定数・プリセット（レイヤー / 用紙 / 動線 / エリア / パーツ）
     2. ドキュメント状態（内部データはすべて実寸 mm）
     3. 幾何ユーティリティ
     4. オブジェクトモデル（端点・線分・中心・外接矩形・当たり判定・変形）
     5. 描画（画面・出力共通。線幅・文字高は「図面上の mm」で指定）
   ========================================================================= */
const FONT = '"Yu Gothic UI","Meiryo","Hiragino Sans","Noto Sans JP",sans-serif';
const PI = Math.PI, rad = d => d * PI / 180, deg = r => r * 180 / PI;
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const clone = o => JSON.parse(JSON.stringify(o));
const fmt = v => Math.round(v).toLocaleString('ja-JP');
const fmt1 = v => (Math.round(v * 10) / 10).toLocaleString('ja-JP');

/* ---------- 1. 定数・プリセット ---------- */
const LAYERS_DEFAULT = [
  ['bg', '背景図'], ['building', '建物'], ['fence', '仮囲い'], ['facility', '仮設施設'], ['machine', '重機'],
  ['vehicle', '車両動線'], ['pedestrian', '歩行者動線'], ['material', '資材置場'], ['safety', '安全設備'],
  ['text', '文字'], ['dim', '寸法']
].map(([id, name]) => ({ id, name, visible: true, locked: false }));

const PAPERS = {
  A3L: { name: 'A3', w: 420, h: 297 }, A3P: { name: 'A3', w: 297, h: 420 },
  A4L: { name: 'A4', w: 297, h: 210 }, A4P: { name: 'A4', w: 210, h: 297 },
  A2L: { name: 'A2', w: 594, h: 420 }, A1L: { name: 'A1', w: 841, h: 594 }
};
const WIDTHS = [0.13, 0.18, 0.25, 0.35, 0.5, 0.7, 1.0, 1.4, 2.0, 3.0];
const DASHES = { solid: '実線', dash: '破線', dashdot: '一点鎖線', dot: '点線' };
const HATCHES = { '': 'なし', diag: '斜線', cross: 'クロス', back: '逆斜線' };
const SHEET_MARGIN = 10;

const ROUTES = {
  vehicle: { name: '工事車両動線', stroke: '#d32f2f', width: 1.0, dash: 'solid', layer: 'vehicle', arrowSize: 5, mid: true, ic: '🚚' },
  delivery: { name: '搬入経路', stroke: '#1565c0', width: 1.0, dash: 'dash', layer: 'vehicle', arrowSize: 5, mid: true, ic: '⇢' },
  pedestrian: { name: '歩行者動線', stroke: '#2e7d32', width: 0.7, dash: 'dash', layer: 'pedestrian', arrowSize: 4, mid: true, ic: '🚶' },
  dirArrow: { name: '進行方向矢印', stroke: '#d32f2f', width: 4, layer: 'vehicle', block: true, ic: '➡' },
  fence: { name: '仮囲い', stroke: '#37474f', width: 0.7, dash: 'solid', layer: 'fence', fence: true, ic: '▤' }
};
const AREAS = {
  material: { name: '資材置場', fill: '#ffd54f', alpha: 0.45, stroke: '#f9a825', layer: 'material', hatch: '', dash: 'solid' },
  noentry: { name: '立入禁止範囲', fill: '#ef5350', alpha: 0.22, stroke: '#c62828', layer: 'safety', hatch: 'diag', dash: 'dash' },
  work: { name: '作業エリア', fill: '#64b5f6', alpha: 0.28, stroke: '#1565c0', layer: 'facility', hatch: '', dash: 'solid' },
  machine: { name: '重機作業範囲', fill: '#ff9800', alpha: 0.22, stroke: '#e65100', layer: 'machine', hatch: 'back', dash: 'dash' },
  lifting: { name: '揚重範囲', fill: '#ab47bc', alpha: 0.18, stroke: '#6a1b9a', layer: 'machine', hatch: '', dash: 'dashdot' }
};

/* パーツ: w,h は実寸 mm（paper:true のものは図面上 mm）。draw は中心原点・x=幅方向 */
function pbox(c, w, h, fill) { if (fill) { c.fillStyle = fill; c.fillRect(-w / 2, -h / 2, w, h); } c.strokeRect(-w / 2, -h / 2, w, h); }
function pchar(c, ch, size, color, x = 0, y = 0, bold = true) {
  c.save(); c.fillStyle = color; c.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(ch, x, y + size * 0.04); c.restore();
}
function pcircle(c, r, fill) { c.beginPath(); c.arc(0, 0, r, 0, 2 * PI); if (fill) { c.fillStyle = fill; c.fill(); } c.stroke(); }
function pline(c, pts) { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.stroke(); }

const PARTS = {
  gate: { name: '工事ゲート', w: 6000, h: 500, layer: 'fence', color: '#1565c0', label: 'out', draw(c, w, h) {
    c.fillStyle = c.strokeStyle; c.fillRect(-w / 2, -h / 2, h, h); c.fillRect(w / 2 - h, -h / 2, h, h);
    const n = 10, pts = []; for (let i = 0; i <= n; i++) pts.push([-w / 2 + h + (w - 2 * h) * i / n, (i % 2 ? 1 : -1) * h * 0.35]); pline(c, pts);
  } },
  pgate: { name: '歩行者ゲート', w: 1200, h: 300, layer: 'fence', color: '#2e7d32', label: 'out', draw(c, w, h) {
    c.fillStyle = c.strokeStyle; c.fillRect(-w / 2, -h / 2, h * .6, h); c.fillRect(w / 2 - h * .6, -h / 2, h * .6, h);
    const L = w - h * 1.2; c.beginPath(); c.moveTo(-w / 2 + h * .6, 0); c.lineTo(-w / 2 + h * .6, -L); c.stroke();
    c.beginPath(); c.arc(-w / 2 + h * .6, 0, L, -PI / 2, 0); c.stroke();
  } },
  guard: { name: 'ガードマン', w: 700, h: 700, layer: 'safety', color: '#0d47a1', label: 'out', draw(c, w) { pcircle(c, w / 2, '#1e88e5'); pchar(c, 'G', w * .62, '#fff'); } },
  cone: { name: 'カラーコーン', w: 450, h: 450, layer: 'safety', color: '#e65100', label: 'none', draw(c, w, h) {
    c.beginPath(); c.moveTo(0, -h / 2); c.lineTo(w / 2, h / 2); c.lineTo(-w / 2, h / 2); c.closePath(); c.fillStyle = '#ff6d00'; c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-w * .2, -h * .05, w * .4, h * .18);
  } },
  barricade: { name: 'バリケード', w: 1200, h: 400, layer: 'safety', color: '#333333', label: 'none', draw(c, w, h) {
    c.save(); c.beginPath(); c.rect(-w / 2, -h / 2, w, h); c.fillStyle = '#ffeb3b'; c.fill(); c.clip(); c.fillStyle = '#222';
    for (let x = -w / 2 - h; x < w / 2 + h; x += h * 1.2) { c.beginPath(); c.moveTo(x, h / 2); c.lineTo(x + h * .6, h / 2); c.lineTo(x + h * 1.6, -h / 2); c.lineTo(x + h, -h / 2); c.closePath(); c.fill(); }
    c.restore(); c.strokeRect(-w / 2, -h / 2, w, h);
  } },
  office: { name: '現場事務所', w: 5400, h: 2400, layer: 'facility', color: '#1565c0', label: 'in', draw(c, w, h) { pbox(c, w, h, '#e3f2fd'); } },
  rest: { name: '休憩所', w: 3600, h: 2400, layer: 'facility', color: '#2e7d32', label: 'in', draw(c, w, h) { pbox(c, w, h, '#e8f5e9'); } },
  toilet: { name: '仮設トイレ', w: 900, h: 1400, layer: 'facility', color: '#6a1b9a', label: 'out', draw(c, w, h) { pbox(c, w, h, '#f3e5f5'); pchar(c, 'WC', Math.min(w * .42, h * .4), '#6a1b9a'); } },
  material: { name: '資材置場', w: 6000, h: 4000, layer: 'material', color: '#f9a825', label: 'in', draw(c, w, h) { c.setLineDash([w / 40, w / 60]); pbox(c, w, h, 'rgba(255,213,79,.45)'); c.setLineDash([]); } },
  waste: { name: '廃材置場', w: 3000, h: 2000, layer: 'material', color: '#6d4c41', label: 'in', draw(c, w, h) { pbox(c, w, h, 'rgba(188,170,164,.45)'); } },
  parking: { name: '駐車場', w: 2500, h: 5000, layer: 'facility', color: '#00838f', label: 'out', draw(c, w, h) { pbox(c, w, h, '#e0f7fa'); pchar(c, 'P', Math.min(w, h) * .6, '#00838f'); } },
  crane: { name: 'クレーン', w: 3000, h: 3000, layer: 'machine', color: '#e65100', label: 'out', radius: 30000, draw(c, w, h) {

function zoomText() { const pxPerMm = 96 / 25.4; return `≒1/${Math.round(pxPerMm / view.k)}`; }
function bindKeys() {
  window.addEventListener('keydown', e => {
    if (e.key === 'Shift') { shiftDown = true; }
    const tg = e.target.tagName; if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT') return;
    if ($('#modal').classList.contains('on')) return;
    if (e.key === ' ') { spaceDown = true; e.preventDefault(); return; }
    const ctrl = e.ctrlKey || e.metaKey;
    if (ctrl && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (ctrl && (e.key === 'y' || e.key === 'Y')) { e.preventDefault(); redo(); return; }

    const map = { v: 'select', h: 'pan', l: 'line', p: 'polyline', r: 'rect', c: 'circle', a: 'arc', f: 'free', w: 'arrow', t: 'text', d: 'dim', m: 'measure' };
    if (!ctrl && !e.altKey && map[e.key.toLowerCase()]) setTool(map[e.key.toLowerCase()]);

function bindTop() {
